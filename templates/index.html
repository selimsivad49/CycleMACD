<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CycleMACD - 日本株MACDバックテストシステム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-chart-line me-2"></i>
                CycleMACD - 日本株バックテストシステム
            </span>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 設定パネル -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-cog me-2"></i>
                            分析設定
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="analysisForm">
                            <div class="row">
                                <div class="col-md-3">
                                    <label for="startDate" class="form-label">開始日</label>
                                    <input type="date" class="form-control" id="startDate" value="2020-01-01">
                                </div>
                                <div class="col-md-3">
                                    <label for="endDate" class="form-label">終了日</label>
                                    <input type="date" class="form-control" id="endDate" value="2024-12-31">
                                </div>
                                <div class="col-md-3">
                                    <label for="timeframe" class="form-label">時間軸</label>
                                    <select class="form-select" id="timeframe">
                                        <option value="M" selected>月足</option>
                                        <option value="W">週足</option>
                                        <option value="D">日足</option>
                                    </select>
                                </div>
                                <div class="col-md-3 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="fas fa-play me-2"></i>
                                        分析開始
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 銘柄選択 -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-building me-2"></i>
                            銘柄選択
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <button class="btn btn-sm btn-outline-primary me-2 mb-2" onclick="selectAllSymbols()">
                                    全て選択
                                </button>
                                <button class="btn btn-sm btn-outline-secondary mb-2" onclick="clearAllSymbols()">
                                    全て解除
                                </button>
                            </div>
                        </div>
                        <div class="row" id="symbolCheckboxes">
                            {% for symbol in symbols %}
                            <div class="col-md-6 col-lg-4 mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="{{ symbol.code }}" 
                                           id="symbol{{ symbol.code }}" checked>
                                    <label class="form-check-label" for="symbol{{ symbol.code }}">
                                        {{ symbol.code }} - {{ symbol.name }}
                                    </label>
                                </div>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分析結果 -->
        <div class="row" id="resultsSection" style="display: none;">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-chart-bar me-2"></i>
                            分析結果
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped" id="resultsTable">
                                <thead>
                                    <tr>
                                        <th>銘柄</th>
                                        <th>戦略リターン</th>
                                        <th>市場リターン</th>
                                        <th>取引回数</th>
                                        <th>勝率</th>
                                        <th>最大DD</th>
                                        <th>シャープ比</th>
                                        <th>Long勝率</th>
                                        <th>Short勝率</th>
                                        <th>L P/L比</th>
                                        <th>S P/L比</th>
                                        <th>チャート</th>
                                    </tr>
                                </thead>
                                <tbody id="resultsBody">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- チャート表示モーダル -->
        <div class="modal fade" id="chartModal" tabindex="-1">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="chartModalTitle">チャート</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body text-center">
                        <div id="chartLoading" class="d-none">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">読み込み中...</span>
                            </div>
                            <p class="mt-2">チャートを生成中...</p>
                        </div>
                        <img id="chartImage" class="img-fluid" style="display: none;">
                        <div id="chartError" class="alert alert-danger d-none"></div>
                        
                        <!-- 取引統計表示 -->
                        <div id="tradeStatistics" class="mt-4" style="display: none;">
                            <h6>取引統計</h6>
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="card border-info">
                                        <div class="card-header bg-info text-white">
                                            <h6 class="mb-0">全体統計</h6>
                                        </div>
                                        <div class="card-body" id="overallStats">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="card border-success">
                                        <div class="card-header bg-success text-white">
                                            <h6 class="mb-0">LONG統計</h6>
                                        </div>
                                        <div class="card-body" id="longStats">
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="card border-danger">
                                        <div class="card-header bg-danger text-white">
                                            <h6 class="mb-0">SHORT統計</h6>
                                        </div>
                                        <div class="card-body" id="shortStats">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ローディング表示 -->
        <div id="loadingOverlay" class="loading-overlay" style="display: none;">
            <div class="text-center">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                    <span class="visually-hidden">分析中...</span>
                </div>
                <p class="mt-3 text-white h5">分析中です。しばらくお待ちください...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
